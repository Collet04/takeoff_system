{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card p-4">
            <h2 class="mb-4">Set new password</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Update password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
